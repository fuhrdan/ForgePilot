name: Feature request
description: Suggest an improvement to ForgePilot
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the simplest user-facing behavior you want.
    validations:
      required: true
  - type: dropdown
    id: resource
    attributes:
      label: Low-resource impact
      options:
        - "Should reduce resource use"
        - "Should be neutral"
        - "May require more resources"
        - "Not sure"
    validations:
      required: true
